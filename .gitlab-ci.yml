# Dependencies are managed in the Dockerfile in the inkscape-ci-docker
# Git repository. Change them there, wait a bit, and then we'll use
# the new ones here in these builds.
image: registry.gitlab.com/cabalist/inkscape-ci-docker/master

stages:
  - build
  - test
  - coverage
  - deploy
variables:
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: recursive


test:python27:
  script:
    - source /root/pyenv-init
    - pyenv shell 2.7.14
    - tox -e py27-normal
    - ls -al
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    paths:
      - .coverage-*
      - htmlcov

test:python35:
  script:
    - source /root/pyenv-init
    - pyenv shell 3.5.6
    - tox -e py35-normal
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    paths:
      - .coverage-*
      - htmlcov


test:python36:
  script:
    - source /root/pyenv-init
    - pyenv shell 3.6.8
    - tox -e py36-normal
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    paths:
      - .coverage-*
      - htmlcov

test:python37:
  script:
    - source /root/pyenv-init
    - pyenv shell 3.7.2
    - tox -e py37-normal
  artifacts:
    name: "$CI_JOB_NAME"
    when: always
    paths:
      - .coverage-*
      - htmlcov


test:coverage:
  stage: coverage
  script:
    - source /root/pyenv-init
    - pyenv shell 3.7.2
    - pip install coverage
    - coverage combine .coverage-*
    - coverage report -m
    - coverage html --ignore-errors --title="Coverage for Inkscape Extensions (${CI_COMMIT_REF_NAME} branch)"
    - echo -e "\n\n"
      "Coverage report successfully created; you can access the full HTML report at\n"
      "  https://${CI_PROJECT_NAMESPACE}.gitlab.io/-/${CI_PROJECT_NAME}/-/jobs/${CI_JOB_ID}/artifacts/htmlcov/index.html"
      "\n\n"
  dependencies:
    - test:python27
    - test:python35
    - test:python36
    - test:python37
  when: always
  coverage: '/TOTAL.+?(\d+%)/'
  artifacts:
    paths:
      - htmlcov/


sphinx:
  stage: test
  when: always
  script:
    - sphinx-apidoc -F -o source inkex
    - python3 setup.py build_sphinx -s source
    - echo -e "\n\n"
      "Documentation for inkex module successfully created; you can access the HTML version at\n"
      "  https://${CI_PROJECT_NAMESPACE}.gitlab.io/-/${CI_PROJECT_NAME}/-/jobs/${CI_JOB_ID}/artifacts/build/sphinx/html/index.html"
      "\n\n"
  artifacts:
    paths:
      - build/sphinx/

pages:
  stage: deploy
  only:
    - master@inkscape/extensions
  when: always
  script:
    - mkdir -p public
    - if test -e htmlcov; then cp -r htmlcov public/coverage; fi
    - if test -e build/sphinx/html; then cp -r build/sphinx/html public/documentation; fi
  artifacts:
    paths:
      - public
