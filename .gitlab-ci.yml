# Dependencies are managed in the Dockerfile in the inkscape-ci-docker
# Git repository. Change them there, wait a bit, and then we'll use
# the new ones here in these builds.
image: registry.gitlab.com/inkscape/inkscape-ci-docker/extensions

variables:
  GIT_DEPTH: "10"
  GIT_SUBMODULE_STRATEGY: recursive


.test: &test
  stage: build
  script:
    - ${COVERAGE} run --parallel-mode --omit=".*","tests/*","*deprecated*","/usr/*" setup.py test
  artifacts:
    paths:
      - .coverage*
    when: always

test:python2:
  <<: *test
  variables:
    COVERAGE: python2-coverage

test:python3:
  <<: *test
  variables:
    COVERAGE: python3-coverage


test:coverage:
  dependencies:
    - test:python2
    - test:python3
  when: always
  script:
    - python3-coverage combine
    - python3-coverage report
    - python3-coverage html --ignore-errors --title="Coverage for Inkscape Extensions (${CI_COMMIT_REF_NAME} branch)"
    - echo -e "\n\n"
              "Coverage report successfully created; you can access the full HTML report at\n"
              "  https://${CI_PROJECT_NAMESPACE}.gitlab.io/-/${CI_PROJECT_NAME}/-/jobs/${CI_JOB_ID}/artifacts/htmlcov/index.html"
              "\n\n"
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    paths:
      - htmlcov/
